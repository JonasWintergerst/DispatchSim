[package]
name = "dispatch_sim"
version = "0.1.0"
edition = "2021"

[dependencies]
geo = "0.32.0"
h3o = "0.6"
petgraph = "0.8.3"
rand = "0.10.0"
rand_distr = "0.6.0"
rayon = "1.11.0"
rusqlite = { version = "0.38", features = ["bundled"] }
bincode = { version = "2", features = ["serde"] }
serde = { version = "1.0.228", features = ["derive"] }
toml = "1.0.1"
serde_json = "1"
osmpbf     = "0.3"
rstar      = "0.12"
eframe     = "0.31"
egui       = "0.31"
ureq       = "2"
image      = { version = "0.25", default-features = false, features = ["png"] }

[[bin]]
name = "dispatch_sim"
path = "src/main.rs"

[[bin]]
name = "optimize"
path = "src/bin/optimize.rs"

[[bin]]
name = "dashboard"
path = "src/bin/dashboard/main.rs"
