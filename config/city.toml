# city.toml
#
# Target scenario: mid-sized European city, ~300 000 residents, police only.
#
# Call-for-service calibration
# ─────────────────────────────
# Source basis: German Polizeieinsatzstatistik / APCO/IACP benchmarks
#   ~300 dispatched calls/day  (≈ 1 per 1 000 residents/day, typical DE/EU)
#   ~12.7 calls/hour at baseline multipliers = 1.0
#   80 patrol units → expected utilisation ≈ 16 % at avg 60 min total engagement
#   (travel + on-scene + return; 300 calls/day, load = 300/(80×24) = 15.6 %)
#   Range: PK 15 = 7 units (Reeperbahn peak) → outer suburban PKs = 2 units
#
# Priority classification used (APCO CAD standard, also aligns with DE Einsatzklassen):
#   Priority A  →  immediate / life threat  (P1 / Einsatz 1) — lights & sirens
#                  target first-unit arrival: < 5 min
#   Priority B  →  urgent, crime in progress or near-miss   (P2 / Einsatz 2)
#                  target: < 15 min
#   Priority C  →  routine / scheduled response              (P3 / Einsatz 3)
#                  target: < 60 min
#
# Note: IncidentKind mapping for a Police-only sim
#   Crime            → disturbance, assault, theft, domestic — ~40 %
#   Accident         → traffic collision, road hazard         — ~25 %
#   MedicalEmergency → welfare check, mental health, assist   — ~25 %
#   Fire             → alarm activation, assist fire brigade  — ~10 %

hex_grid_path  = "config/hexes.json"
districts_path = "config/districts.json"

[sim]
tick_minutes     = 1
duration_minutes = 2_102_400   # 4 simulated years
rng_seed         = 42
sim_type         = "Police"
record_routes      = false
osm_path           = "config/hamburg-260331.osm.pbf"
routing_cache_path = "output/routing_cache.bin"

# Maps the abstract (col, row) hex grid onto Hamburg's geographic footprint.
# row 0 = north (lat_max), row N = south (lat_min).
# col 0 = west  (lon_min), col N = east  (lon_max).
[hex_grid_bounds]
lat_min = 53.395
lat_max = 53.715
lon_min =  9.730
lon_max = 10.330

