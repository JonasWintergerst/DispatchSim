# city.toml

hex_grid_path = "config/hexes.json"

[sim]
tick_minutes     = 1
duration_minutes = 2_102_400   # 4 years
rng_seed         = 42
sim_type         = "Police"   # Fire | Police | Medical — all units inherit this

# ---------------------------------------------------------------------------
# Districts + stations
# IDs must match district_id values in hexes.json
# ---------------------------------------------------------------------------

[[districts]]
id   = 0
name = "Northwest"

[districts.station]
id         = 0
name       = "Station Northwest"
unit_count = 3

[[districts]]
id   = 1
name = "North Central"

[districts.station]
id         = 1
name       = "Station North Central"
unit_count = 3

[[districts]]
id   = 2
name = "Northeast"

[districts.station]
id         = 2
name       = "Station Northeast"
unit_count = 3

[[districts]]
id   = 3
name = "Southwest"

[districts.station]
id         = 3
name       = "Station Southwest"
unit_count = 3

[[districts]]
id   = 4
name = "Central"

[districts.station]
id         = 4
name       = "Station Central"
unit_count = 5

[[districts]]
id   = 5
name = "Southeast"

[districts.station]
id         = 5
name       = "Station Southeast"
unit_count = 3

[[districts]]
id   = 6
name = "South Central"

[districts.station]
id         = 6
name       = "Station South Central"
unit_count = 3

